[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "structure-work"
version = "0.1.0"
description = "Vision pipeline with YOLO, SAM2, and EfficientNet"
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "torch",
    "torchvision",
    "sam2",
    "matplotlib",
    "timm",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[tool.setuptools]
packages = ["app", "app.api", "app.core", "app.models", "app.predictors"]
py-modules = ["main"]
